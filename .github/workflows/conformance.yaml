name: OIDC Conformance Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  conformance:
    name: Conformance Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      oidc-db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oidc
          POSTGRES_USER: root
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U root -d oidc"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - parallel:
          - uses: actions/setup-go@v7
            with:
              go-version-file: go.mod

          - uses: actions/setup-python@v7
            with:
              python-version-file: .github/scripts/pyproject.toml

          - uses: astral-sh/setup-uv@v10.0.0

          - name: Login to GHCR
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start conformance suite
        id: conformance-suite-start
        run: docker compose -f .github/conformance/docker-compose.yml up --wait --wait-timeout 300
        background: true
        timeout-minutes: 6

      - parallel:
          - name: Apply DB schema
            run: psql -h 127.0.0.1 -p 5433 -U root -d oidc -f db/schema.sql
            env:
              PGPASSWORD: password

          - name: Build portal-oidc
            run: go build -o portal-oidc ./cmd/

          - name: Generate RSA key
            run: |
              mkdir -p data
              openssl genpkey -algorithm RSA -out data/private.pem -pkeyopt rsa_keygen_bits:2048

      - name: Start portal-oidc
        id: portal-oidc
        run: exec ./portal-oidc serve
        background: true
        env:
          OIDC_HOST: http://host.docker.internal:8080
          OIDC_DATABASE__HOST: 127.0.0.1
          OIDC_DATABASE__PORT: "5433"
          OIDC_DATABASE__USER: root
          OIDC_DATABASE__PASSWORD: password
          OIDC_DATABASE__NAME: oidc
          OIDC_OAUTH__SECRET: conformance-test-secret-key-32!!

      - name: Wait for conformance suite startup
        wait: conformance-suite-start

      - name: Wait for portal-oidc
        timeout-minutes: 2
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 60
          --connect-timeout 2 --max-time 5
          http://localhost:8080/health

      - name: Run conformance tests
        run: .github/conformance/run.sh
        env:
          CONFORMANCE_SERVER: https://localhost:8443
          CONFORMANCE_TOKEN: ""
          CONFORMANCE_DEV_MODE: "1"
          PORTAL_OIDC_URL: http://localhost:8080
          DISCOVERY_URL: http://host.docker.internal:8080/.well-known/openid-configuration

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-results
          path: .github/conformance/results/
          retention-days: 30

      - name: Conformance suite logs
        if: failure()
        run: docker compose -f .github/conformance/docker-compose.yml logs --tail=200

      - name: Stop portal-oidc
        cancel: portal-oidc
