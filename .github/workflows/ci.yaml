name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to minimal permissions
permissions:
  contents: read

env:
  MISE_LOCKED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          install-mode: none
          args: --config=.golangci.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - name: Build
        run: go build -v ./...

      - name: Build Docker image
        run: docker build --target production -t portal-oidc:ci .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    permissions:
      contents: read
    services:
      oidc-db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oidc
          POSTGRES_USER: root
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U root -d oidc"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      portal-db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: portal
          POSTGRES_USER: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d portal"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          POSTGRES_HOSTNAME: 127.0.0.1
          POSTGRES_PORT: "5433"

      - name: Build and test login assets
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- ../internal/router/v1/loginassets
          npm test
          npx playwright install --with-deps chromium

      - name: Browser login and OIDC flow
        env:
          PGPASSWORD: password
          OIDC_INTERNAL__TOKEN: browser-test-internal-token
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U root -d oidc -f db/schema.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U root -d portal -f db/portal-schema.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U root -d portal -f development/seed-profile.sql
          go build -o /tmp/portal-oidc ./cmd
          /tmp/portal-oidc serve > /tmp/portal-oidc.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/portal-oidc.log' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 http://localhost:8080/health
          npm --prefix web run test:browser

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        continue-on-error: true
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  vulnerability:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - name: Run govulncheck
        run: govulncheck ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - name: Run Gosec Security Scanner
        run: gosec -exclude-generated -fmt sarif -out gosec.sarif ./...

      - name: Upload Gosec SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif
