services:
  mongodb:
    image: mongo:8.3.7
  httpd:
    image: ghcr.io/traptitech/portal-oidc/conformance-httpd:release-v5.1.35
    ports:
      - "8443:8443"
    depends_on:
      - server
    # TODO: Use a dedicated /healthz endpoint when the conformance suite provides one.
    healthcheck:
      test: >-
        printf 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'
        | openssl s_client -quiet -connect localhost:8443 -servername localhost
        2>/dev/null | grep -q '^HTTP/.* 200'
      interval: 5s
      timeout: 5s
      retries: 60
  server:
    image: ghcr.io/traptitech/portal-oidc/conformance-server:release-v5.1.35
    environment:
      - openid.mongodb.targetFeatureCompatibilityVersion=8.3
    command: >
      java
      -Djdk.tls.maxHandshakeMessageSize=65536
      -jar /server/fapi-test-suite.jar
      --fintechlabs.base_url=https://localhost.emobix.co.uk:8443
      --fintechlabs.devmode=true
      --fintechlabs.startredir=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
    logging:
      driver: json-file
      options:
        max-size: "500k"
        max-file: "5"
