{
  "openapi": "3.0.3",
  "info": {
    "title": "Portal internal identity API",
    "version": "1.0.0"
  },
  "security": [
    {
      "InternalToken": []
    }
  ],
  "paths": {
    "/internal/users/provision": {
      "post": {
        "operationId": "provisionUser",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ProvisionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Identical replay"
          },
          "201": {
            "description": "Committed"
          },
          "400": {
            "description": "Malformed input"
          },
          "401": {
            "description": "Unauthorized"
          },
          "409": {
            "description": "Identity conflict"
          },
          "422": {
            "description": "Invalid account"
          },
          "500": {
            "description": "Outcome may be unknown"
          }
        }
      }
    },
    "/internal/users/{userId}": {
      "delete": {
        "operationId": "deleteUser",
        "parameters": [
          {
            "in": "path",
            "name": "userId",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Deleted or absent"
          },
          "400": {
            "description": "Invalid UUID"
          },
          "401": {
            "description": "Unauthorized"
          },
          "500": {
            "description": "Deletion failed"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "InternalToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Portal-Internal-Token"
      }
    },
    "schemas": {
      "ProvisionRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "userId": {
            "type": "string",
            "format": "uuid",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*uuid.UUID",
            "x-go-type-import": {
              "path": "github.com/google/uuid"
            }
          },
          "email": {
            "type": "string",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*string"
          },
          "emailVerified": {
            "type": "boolean",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*bool"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*time.Time"
          },
          "authVerifier": {
            "$ref": "#/components/schemas/AuthVerifier",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*AuthVerifier"
          }
        },
        "required": [
          "userId",
          "email",
          "emailVerified",
          "expiresAt",
          "authVerifier"
        ]
      },
      "AuthVerifier": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "version": {
            "type": "integer",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*int"
          },
          "alg": {
            "type": "string",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*string"
          },
          "hash": {
            "type": "string",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*string"
          },
          "params": {
            "$ref": "#/components/schemas/KDFParams",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*KDFParams"
          }
        },
        "required": [
          "version",
          "alg",
          "hash",
          "params"
        ]
      },
      "KDFParams": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kdf": {
            "type": "string",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*string"
          },
          "version": {
            "type": "integer",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*int"
          },
          "memoryKiB": {
            "type": "integer",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*int"
          },
          "iterations": {
            "type": "integer",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*int"
          },
          "parallelism": {
            "type": "integer",
            "x-go-type-skip-optional-pointer": false,
            "x-go-type": "*int"
          }
        },
        "required": [
          "kdf",
          "version",
          "memoryKiB",
          "iterations",
          "parallelism"
        ]
      }
    }
  }
}
